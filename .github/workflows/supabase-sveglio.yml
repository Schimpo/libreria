# Riduce il rischio che Supabase metta in pausa il database.
# Nel piano gratuito Supabase mette in pausa il progetto dopo 7 giorni con poca attività;
# la sua documentazione dice che di solito bastano "qualche richiesta al giorno", senza una
# soglia precisa. Questa attività fa 3 richieste al giorno con la chiave publishable presa da
# js/config.js (è già pubblica nel codice): senza accesso le regole RLS non mostrano nessun
# libro, quindi la risposta è un elenco vuoto. Non è una garanzia: se arrivano comunque gli
# avvisi di Supabase, bisogna fare di più.
# Se il progetto è in pausa o non risponde, l'attività fallisce. GitHub manda l'email a chi ha
# creato l'attività (o ne ha cambiato l'orario), solo se ha attivato le notifiche di Actions.
# GitHub spegne le attività programmate dopo 60 giorni senza commit nel repository; prima
# avvisa per email, e si riaccendono dalla scheda Actions.

name: Tieni attivo Supabase

on:
  schedule:
    - cron: '17 */8 * * *'   # ogni giorno alle 0:17, 8:17 e 16:17 UTC
  workflow_dispatch:        # si può avviare anche a mano dalla scheda Actions

permissions:
  contents: read

jobs:
  richiesta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Richiesta al database
        run: |
          url=$(sed -n "s/^export const SUPABASE_URL = '\(.*\)';/\1/p" js/config.js)
          key=$(sed -n "s/^export const SUPABASE_KEY = '\(.*\)';/\1/p" js/config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Indirizzo o chiave di Supabase non trovati in js/config.js"
            exit 1
          fi
          code=$(curl -s -o risposta.txt -w '%{http_code}' --max-time 30 \
            -H "apikey: $key" "$url/rest/v1/books?select=id&limit=1")
          echo "Risposta di Supabase: HTTP $code"
          if [ "$code" != "200" ]; then
            cat risposta.txt 2>/dev/null
            echo "Supabase non ha risposto come previsto: il progetto potrebbe essere in pausa."
            exit 1
          fi
